name: build
on:
  push:
    branches: [main]
jobs:
  build:
    permissions:
      contents: read
    # All build logic lives in the shared template, pinned to a version.
    uses: jaswennyhuang/lab-ci-templates/.github/workflows/build.yml@v1.1.0
    with:
      service: svc-a
      platform_repo: jaswennyhuang/oneflow-lab
    secrets:
      token: ${{ secrets.LAB_TOKEN }}
